# ====================================================================
# AI-Platform GitLab CI/CD
# ====================================================================
# Pipeline:
#   - lint:    Code style checks
#   - test:    Unit tests
#   - build:   Build artifacts
#   - package: Create release package
#   - deploy:  Deploy to staging/production
# ====================================================================

stages:
  - lint
  - test
  - build
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/ai-platform-backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/ai-platform-frontend"
  VERSION: "$CI_COMMIT_SHORT_SHA"

# Cache dependencies
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - ai-backend/.m2/repository
    - ai-frontend/node_modules
    - ai-frontend/dist

# ====================================================================
# Lint Stage
# ====================================================================
lint:backend:
  stage: lint
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd ai-backend
    - mvn $MAVEN_CLI_OPTS checkstyle:check
  allow_failure: true
  rules:
    - changes:
        - ai-backend/**/*

lint:frontend:
  stage: lint
  image: node:24
  script:
    - cd ai-frontend
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline
    - npx eslint . --ext .ts,.vue --max-warnings 0 || true
    - npx stylelint "**/*.{vue,css,less,scss}" --max-warnings 0 || true
  allow_failure: true
  rules:
    - changes:
        - ai-frontend/**/*

# ====================================================================
# Test Stage
# ====================================================================
test:backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: mariadb:12.2
      alias: mariadb
      command: ["--default-authentication-plugin=mysql_native_password"]
  variables:
    MARIADB_ROOT_PASSWORD: "root"
    MARIADB_DATABASE: "ai_platform_test"
    SPRING_DATASOURCE_URL: "jdbc:mariadb://mariadb:3306/ai_platform_test"
    SPRING_DATASOURCE_USERNAME: "root"
    SPRING_DATASOURCE_PASSWORD: "root"
  script:
    - cd ai-backend
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - ai-backend/**/target/surefire-reports/TEST-*.xml
    paths:
      - ai-backend/**/target/surefire-reports/
    expire_in: 7 days
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - changes:
        - ai-backend/**/*

test:frontend:
  stage: test
  image: node:24
  script:
    - cd ai-frontend
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline
    - npm run test:unit || true
  artifacts:
    when: always
    reports:
      junit:
        - ai-frontend/junit.xml
    expire_in: 7 days
  allow_failure: true
  rules:
    - changes:
        - ai-frontend/**/*

# ====================================================================
# Build Stage
# ====================================================================
build:backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd ai-backend
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - ai-backend/ai-start/target/*.jar
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build:frontend:
  stage: build
  image: node:24
  script:
    - cd ai-frontend
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - ai-frontend/dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ====================================================================
# Package Stage
# ====================================================================
package:release:
  stage: package
  image: alpine:3.19
  before_script:
    - apk add --no-cache tar
  script:
    - mkdir -p release/backend release/frontend release/scripts release/nginx
    - cp ai-backend/ai-start/target/*.jar release/backend/
    - cp -r ai-frontend/dist/* release/frontend/
    - cp -r ai-deploy/scripts/* release/scripts/
    - cp -r ai-deploy/nginx/* release/nginx/
    - cp ai-deploy/README.md release/
    - cd release
    - tar -czf ai-platform-${VERSION}.tar.gz backend frontend scripts nginx README.md
  artifacts:
    name: "ai-platform-${VERSION}"
    paths:
      - release/ai-platform-${VERSION}.tar.gz
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Docker images (optional)
package:docker:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t ${BACKEND_IMAGE}:${VERSION} -f ai-deploy/docker/Dockerfile.backend ai-backend
    - docker build -t ${FRONTEND_IMAGE}:${VERSION} -f ai-deploy/docker/Dockerfile.frontend ai-frontend
    - docker push ${BACKEND_IMAGE}:${VERSION}
    - docker push ${FRONTEND_IMAGE}:${VERSION}
  rules:
    - if: $CI_COMMIT_TAG
  allow_failure: true

# ====================================================================
# Deploy Stage
# ====================================================================
deploy:staging:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - scp release/ai-platform-${VERSION}.tar.gz $STAGING_USER@$STAGING_HOST:/tmp/deploy/
    - ssh $STAGING_USER@$STAGING_HOST "cd /tmp/deploy && tar -xzf ai-platform-${VERSION}.tar.gz && sudo /opt/ai-platform/scripts/deploy.sh staging"
    - ssh $STAGING_USER@$STAGING_HOST "sleep 10 && curl -f http://localhost:8080/actuator/health"
  environment:
    name: staging
    url: https://staging.ai-platform.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: false

deploy:production:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - ssh $PROD_USER@$PROD_HOST "sudo /opt/ai-platform/scripts/backup.sh"
    - scp release/ai-platform-${VERSION}.tar.gz $PROD_USER@$PROD_HOST:/tmp/deploy/
    - ssh $PROD_USER@$PROD_HOST "cd /tmp/deploy && tar -xzf ai-platform-${VERSION}.tar.gz && sudo /opt/ai-platform/scripts/deploy.sh production"
    - ssh $PROD_USER@$PROD_HOST "sleep 15 && curl -f http://localhost:8080/actuator/health"
  environment:
    name: production
    url: https://ai-platform.example.com
  rules:
    - if: $CI_COMMIT_TAG
  when: manual
  allow_failure: false
