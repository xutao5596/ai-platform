# ====================================================================
# AI-Platform 反向代理 + 静态资源
# 安装: sudo cp ai-platform.conf /etc/nginx/conf.d/
# 检查: sudo nginx -t
# 重载: sudo systemctl reload nginx
# ====================================================================

# 上游(后端 jar)
upstream ai_platform_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP server(无 HTTPS 时直接对外提供 80)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/ai-platform.access.log;
    error_log  /var/log/nginx/ai-platform.error.log;

    # 客户端上传体积上限(与 Spring 一致)
    client_max_body_size 200M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # 代理超时
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf;

    # ---------- 后端 API + SSE ----------
    location /api/ {
        proxy_pass         http://ai_platform_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # SSE 兼容:关闭缓冲
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   X-Accel-Buffering no;
    }

    # 内部 /actuator 仅本机可见
    location /actuator/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass         http://ai_platform_backend;
    }

    # Knife4j / Swagger UI
    location /swagger-ui/ {
        proxy_pass http://ai_platform_backend;
    }
    location /v3/api-docs {
        proxy_pass http://ai_platform_backend;
    }
    location /doc.html {
        proxy_pass http://ai_platform_backend;
    }

    # ---------- 前端静态资源 ----------
    location / {
        root /opt/ai-platform/frontend;
        try_files $uri $uri/ /index.html;
        index index.html;

        # 强缓存(带 hash 的资源,例如 Vite 产物)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
        }

        # HTML 不缓存
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # 错误页 → 前端兜底
    error_page 404 /index.html;
}